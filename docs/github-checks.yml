name: Project checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            assis-backend/package-lock.json
            assis-workspace/package-lock.json
      - run: npm ci --prefix assis-backend && npm ci --prefix assis-workspace
      - run: node scripts/setup-assets.mjs
      - run: npm test --prefix assis-backend
      - run: npm test --prefix assis-workspace
      - run: npm run build --prefix assis-workspace
